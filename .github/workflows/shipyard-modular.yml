name: Shipyard modular installer (test)

# Manual-only test build. This never runs on tags, never signs, and never attaches
# anything to a GitHub release. It exists so the full modular payload can be tested
# before the release workflow is switched to it.

on:
  workflow_dispatch:

concurrency:
  group: shipyard-modular-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  windows:
    name: Modular Windows installer
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
            src-tauri/music-module
            installer/src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Fetch libmpv
        run: pnpm run setup:libmpv

      - name: Fetch mpv
        run: pnpm run setup:mpv

      - name: Fetch external binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          TARGET="x86_64-pc-windows-msvc"
          EXT=".exe"

          echo "Downloading yt-dlp..."
          curl --retry 6 --retry-delay 4 --retry-all-errors -L \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" \
            -o "yt-dlp-${TARGET}${EXT}"

          echo "Fetching ffmpeg and ffprobe..."
          curl --retry 6 --retry-delay 4 --retry-all-errors -L \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" \
            -o ffmpeg.zip
          unzip -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
          mv ffmpeg.exe "ffmpeg-${TARGET}${EXT}"
          mv ffprobe.exe "ffprobe-${TARGET}${EXT}"

      - name: Build Pokemon engine
        run: node tools/pokemon-engine/build.mjs --fetch-source "${{ runner.temp }}/harbor-pokemon-source" --output src-tauri/resources/pokemon-engine --artifacts "${{ runner.temp }}/harbor-pokemon-build"

      - name: Build modular Shipyard installer
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-shipyard-modules.ps1 -Channel beta

      - name: Verify modular payload components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'installer/src-tauri/payload/harbor-payload.zip').Path)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
            foreach ($required in @(
              'components/music/harbor-music-module.exe',
              'capstan/capstan.jar',
              'resources/pokemon-engine/Harbor.PokemonEngine.exe'
            )) {
              if (-not ($names -contains $required)) { throw "Missing component in payload: $required" }
            }
          } finally {
            $zip.Dispose()
          }
          Write-Host 'Payload contains Music, Extensions, and Games.'

      - name: Prepare test artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          foreach ($exe in @(
            'src-tauri/target/music-sidecar/release/harbor.exe',
            'installer/src-tauri/target/release/harbor-uninstall.exe',
            'installer/src-tauri/target/release/harbor-shipyard.exe'
          )) {
            if ((Get-Item -LiteralPath $exe).VersionInfo.FileVersion -ne $version) {
              throw "Wrong version in $exe"
            }
          }
          $installer = "installer/src-tauri/target/release/harbor-shipyard-v$version-beta.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Missing modular installer: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath "$installer.sha256" -Encoding utf8
          Get-Item -LiteralPath $installer | Format-List Name,Length,LastWriteTime
          Get-Content -LiteralPath "$installer.sha256"

      - name: Upload modular installer
        uses: actions/upload-artifact@v4
        with:
          name: harbor-Windows-modular
          path: |
            installer/src-tauri/target/release/harbor-shipyard-v*-beta.exe
            installer/src-tauri/target/release/harbor-shipyard-v*-beta.exe.sha256
          retention-days: 14
          if-no-files-found: error
