[package]
name = "harbor-extensions-module"
version = "1.0.1"
edition = "2021"

[dependencies]
dunce = "1"

serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
test-fixtures = []

[[bin]]
name = "extensions-test-runtime"
path = "src/bin/runtime_fixture.rs"
required-features = ["test-fixtures"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
